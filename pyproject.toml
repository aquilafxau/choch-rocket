[project]
name = "choch-rocket"
version = "0.1.0"
description = "Choch Rocket — Protrend M15 GO/HALF/VETO recommender with shadow sim"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
choch-replay = "app.replay:main"
choch-stats = "app.stats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::starlette.exceptions.StarletteDeprecationWarning",
  "error:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.uv]
package = true
